# ===== tutorial =====
tutorial.command.desc=查看服務器教程
tutorial.menu.next=[sky]下一頁 →
tutorial.menu.page1=[gold]=== 伺服器教學 [gray]1/4[gold] ===[white]\n\n[red]事先說明：建議先通關戰役再來遊玩伺服器，否則可能跟不上節奏。[white]\n\n[green]【基本指令】[white]\n指令以 [accent]/[white] 開頭，在聊天框輸入後按 Enter 執行。\n例：[accent]/help[white] 查看全部指令 [accent]/playerInfo[white] 查詢玩家\n[accent]/status[white] 伺服器狀態 [accent]/trChat[white] 設定聊天翻譯\n\n[green]【選單操作】[white]\n大部分指令會直接彈出選單，點擊按鈕即可，無需記憶複雜指令。\n不記得指令？隨時 [accent]/help[white] 查看，或 [accent]/search 關鍵字[white] 搜尋指令。
tutorial.menu.page2=[gold]=== 伺服器教學 [gray]2/4[gold] ===[white]\n\n[green]【UID 與 @提及】[white]\nUID 是你名字後面那個[gold]灰色數字[]，用於 [accent]@提及[white]：\n格式：[gold]@數字 文字[white]，如 [gold]@123 你好！[white]\n被提及的玩家會收到提示，常用於喚人、組隊。\n\n[green]【UUID】[white]\nUUID 是帳號的唯一身分識別，伺服器用它識別你的身分。\n\n[red]【⚠ 安全警告】[white]\n[scarlet]切勿在聊天或公開場合透露 UUID！[white]\n惡意玩家取得你的 UUID 後可能冒充你執行操作。\n[gold]保護 UUID = 保護你的帳號安全！
tutorial.menu.page3=[gold]=== 伺服器教學 [gray]3/4[gold] ===[white]\n\n[green]【投票系統】[white]\n[accent]/vote[white] 查看全部投票。常用：\n[accent]/vote gameOver[white] 投票結束本局\n[accent]/vote skipWave[white] 投票跳過波次\n[accent]/vote fire[white] 投票開啟無限火力\n\n發起投票後，在聊天框發送 [accent]1/y[white] 同意、[accent]0/n[white] 反對。\n\n[red]請注意！[white]理性投票，嚴禁跟風！先弄清狀況再投。
tutorial.menu.page4=[gold]=== 伺服器教學 [gray]4/4[gold] ===[white]\n\n[green]【伺服器插件】[white]\n本服有大量特色插件，多為選單操作：\n[accent]/skill[white] 技能系統 [accent]/home[white] 設定/傳送家\n[accent]/tp[white] 傳送 [accent]/999[white] 領地認領\n[accent]/gather[white] 集合傳送 [accent]/schematic[white] 建築藍圖\n\n[green]【自動保護】[white]\n伺服器內建防炸核心、反邏輯病毒等保護，\n危險建築會警告並標記地點，惡意程式碼將被停用。\n\n[yellow]點擊下方 [green]關閉 [yellow]按鈕結束教學，祝你玩得愉快！
tutorial.menu.title=[green]伺服器教學
tutorial.reply.playerOnly=[red]僅玩家可用

