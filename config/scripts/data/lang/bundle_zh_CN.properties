# tutorial.kts
tutorial.menu.title=[green]服务器教程
tutorial.menu.next=[sky]下一页 →
tutorial.menu.page1=[gold]=== 服务器教程 [gray]1/4[gold] ===[white]\n\n[red]事先说明：建议先通关战役再来游玩服务器，否则可能跟不上节奏。[white]\n\n[green]【基本指令】[white]\n命令以 [accent]/[white] 开头，在聊天框输入后回车执行。\n例：[accent]/help[white] 查看全部命令 [accent]/playerInfo[white] 查询玩家\n[accent]/status[white] 服务器状态 [accent]/trChat[white] 配置聊天翻译\n\n[green]【菜单操作】[white]\n大部分命令会直接弹出菜单，点击按钮即可，无需记忆复杂指令。\n不记得命令？随时 [accent]/help[white] 查看，或 [accent]/search 关键词[white] 搜索命令。
tutorial.menu.page2=[gold]=== 服务器教程 [gray]2/4[gold] ===[white]\n\n[green]【UID 与 @提及】[white]\nUID 是你名字后面那个[gold]灰色数字[]，用于 [accent]@提及[white]：\n格式：[gold]@数字 文本[white]，如 [gold]@123 你好！[white]\n被提及的玩家会收到提示，常用于喊人、组队。\n\n[green]【UUID】[white]\nUUID 是账号的唯一身份标识，服务器用它识别你的身份。\n\n[red]【⚠ 安全警告】[white]\n[scarlet]切勿在聊天或公开场合透露 UUID！[white]\n恶意玩家获取你的 UUID 后可能冒充你执行操作。\n[gold]保护 UUID = 保护你的账号安全！
tutorial.menu.page3=[gold]=== 服务器教程 [gray]3/4[gold] ===[white]\n\n[green]【投票系统】[white]\n[accent]/vote[white] 查看全部投票。常用：\n[accent]/vote gameOver[white] 投票结束本局\n[accent]/vote skipWave[white] 投票跳过波次\n[accent]/vote fire[white] 投票开启无限火力\n\n发起投票后，在聊天框发送 [accent]1/y[white] 同意、[accent]0/n[white] 反对。\n\n[red]请注意！[white]理性投票，严禁跟风！先弄清状况再投。
tutorial.menu.page4=[gold]=== 服务器教程 [gray]4/4[gold] ===[white]\n\n[green]【服务器插件】[white]\n本服有大量特色插件，多为菜单操作：\n[accent]/skill[white] 技能系统 [accent]/home[white] 设置/传送家\n[accent]/tp[white] 传送 [accent]/999[white] 领地认领\n[accent]/gather[white] 集合传送 [accent]/schematic[white] 建筑蓝图\n\n[green]【自动保护】[white]\n服务器内置防炸核心、反逻辑病毒等保护，\n危险建筑会警告并标记地点，恶意代码将被停用。\n\n[yellow]点击下方 [green]关闭 [yellow]按钮结束教程，祝你玩得愉快！

