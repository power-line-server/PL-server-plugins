[green]【头衔文本】[white]
输入想显示的文字, 颜色由颜色方案自动上色, 无需手动写颜色代码

[green]【颜色】[white]
预设色板: 火焰/海洋/彩虹等一键使用
自定义: 逗号分隔多个 #RRGGBB

[green]【模式】[white]
[accent]普通渐变[]: 每字符用预设颜色
[accent]柔和渐变[]: 颜色间慢慢过渡更丝滑

[green]【滚动】[white]
[accent]单色字符数[]: 每个颜色作用的字符数
例: 2 → 1(红)2(红)3(蓝)4(蓝)
[accent]自适应[]: 头衔比颜色多时循环铺满

[green]【方向与边界】[white]
[accent]方向[]: 颜色 左→右 / 右→左 流动

[green]【切换间隔】[white]
柔和渐变时相邻颜色间插入的过渡色数(至少1)
例: 1 → 红, 中间色, 黄

[green]【示例】[white]
文本"123456", 颜色红黄蓝, 速度1, 自适应开:
1(红)2(黄)3(蓝)4(红)5(黄)6(蓝), 每秒整体流动
