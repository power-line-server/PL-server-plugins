# tutorial.kts
tutorial.menu.title=[green]サーバーチュートリアル
tutorial.menu.page1=[gold]=== サーバーチュートリアル [gray]1/4[gold] ===[white]\n\n[red]先に：サーバーで遊ぶ前にキャンペーンをクリアすることをお勧めします。[white]\n\n[green]【基本コマンド】[white]\nコマンドは [accent]/[white] で始まり、チャットに入力して Enter で実行します。\n例：[accent]/help[white] 全コマンド表示 [accent]/playerInfo[white] プレイヤー情報\n[accent]/status[white] サーバー状態 [accent]/trChat[white] 翻訳設定\n\n[green]【メニュー操作】[white]\nほとんどのコマンドはメニューが開き、ボタンをクリックするだけです。\nコマンドを忘れたら [accent]/help[white]、または [accent]/search キーワード[white] で検索。
tutorial.menu.page2=[gold]=== サーバーチュートリアル [gray]2/4[gold] ===[white]\n\n[green]【UID と @メンション】[white]\nUID は名前の後ろにある[gold]灰色の数字[]で、[accent]@メンション[white]に使います：\n形式：[gold]@数字 テキスト[white]（例：[gold]@123 こんにちは！[white]）\nメンションされたプレイヤーに通知が行きます。\n\n[green]【UUID】[white]\nUUID はアカウントの一意な識別子で、サーバーはこれであなたを認識します。\n\n[red]【⚠ セキュリティ警告】[white]\n[scarlet]UUID をチャットや公開場所で絶対に漏らさないでください！[white]\n悪意のあるプレイヤーがあなたを装う恐れがあります。\n[gold]UUID を守る = アカウントを守る！
tutorial.menu.page3=[gold]=== サーバーチュートリアル [gray]3/4[gold] ===[white]\n\n[green]【投票システム】[white]\n[accent]/vote[white] で全投票を表示。よく使うもの：\n[accent]/vote gameOver[white] ゲーム終了投票\n[accent]/vote skipWave[white] ウェーブスキップ投票\n[accent]/vote fire[white] 無限火力投票\n\n投票開始後、チャットで [accent]1/y[white] 賛成、[accent]0/n[white] 反対。\n\n[red]注意！[white]冷静に投票し、流されないでください！
tutorial.menu.page4=[gold]=== サーバーチュートリアル [gray]4/4[gold] ===[white]\n\n[green]【サーバープラグイン】[white]\n多くのプラグインがあり、ほとんどがメニュー操作です：\n[accent]/skill[white] スキル [accent]/home[white] ホーム設定/転送\n[accent]/tp[white] 転送 [accent]/999[white] 領地登録\n[accent]/gather[white] 集合転送 [accent]/schematic[white] 設計図\n\n[green]【自動保護】[white]\n防爆コア・ロジックウイルス対策などの保護機能が組み込まれており、\n危険な建築は警告・マークされ、悪意のあるコードは無効化されます。\n\n[yellow]下の [green]閉じる [yellow]ボタンで終了。楽しんでください！
tutorial.menu.next=[sky]次へ →

