# tutorial.kts
tutorial.menu.title=[green]Обучение
tutorial.menu.page1=[gold]=== Обучение [gray]1/4[gold] ===[white]\n\n[red]Совет: пройдите кампанию перед игрой на сервере.[white]\n\n[green]【Основные команды】[white]\nКоманды начинаются с [accent]/[white]; вводите в чат и жмите Enter.\n[accent]/help[white] все команды  [accent]/playerInfo[white] инфо о игроках\n[accent]/status[white] статус сервера  [accent]/trChat[white] перевод чата\n\n[green]【Меню】[white]\nБольшинство команд открывают меню с кнопками.\nНе помните команду? [accent]/help[white] или [accent]/search слово[white].
tutorial.menu.page2=[gold]=== Обучение [gray]2/4[gold] ===[white]\n\n[green]【UID и @упоминания】[white]\nUID — [gold]серый номер[white] рядом с именем, для [accent]@упоминаний[white]:\nФормат: [gold]@число текст[white] (например [gold]@123 привет![white])\nУпомянутый игрок получит уведомление.\n\n[green]【UUID】[white]\nUUID — уникальный идентификатор аккаунта, сервер опознаёт вас по нему.\n\n[red]【⚠ ВАЖНО】[white]\n[scarlet]НИКОГДА не сообщайте UUID в чате или публично![white]\nЗлоумышленники могут выдать себя за вас.\n[gold]Защита UUID = защита аккаунта!
tutorial.menu.page3=[gold]=== Обучение [gray]3/4[gold] ===[white]\n\n[green]【Голосования】[white]\n[accent]/vote[white] — все голосования. Частые:\n[accent]/vote gameOver[white] завершить игру\n[accent]/vote skipWave[white] пропустить волну\n[accent]/vote fire[white] бесконечный боезапас\n\nКогда идёт голосование, шлите [accent]1/y[white] за, [accent]0/n[white] против.\n\n[red]Голосуйте осознанно, без стадного чувства!
tutorial.menu.page4=[gold]=== Обучение [gray]4/4[gold] ===[white]\n\n[green]【Плагины сервера】[white]\nМного плагинов, в основном через меню:\n[accent]/skill[white] навыки  [accent]/home[white] дом/телепорт домой\n[accent]/tp[white] телепорт  [accent]/999[white] заявка на территорию\n[accent]/gather[white] сбор  [accent]/schematic[white] схемы\n\n[green]【Автозащита】[white]\nВстроены защита от взрыва ядер и антивирус логики:\nопасные постройки отмечаются, вредоносный код отключается.\n\n[yellow]Нажмите [green]Закрыть [yellow]для завершения. Приятной игры!
tutorial.menu.next=[sky]Далее →

