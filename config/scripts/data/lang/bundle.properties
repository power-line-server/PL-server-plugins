# ===== tutorial =====
tutorial.command.desc=Reload Tutorial
tutorial.menu.next=[sky]Next →
tutorial.menu.page1=[gold]=== Server Tutorial [gray]1/4[gold] ===[white]\n\n[red]Note: finish the campaign before joining the server.[white]\n\n[green]【Basic Commands】[white]\nCommands start with [accent]/[white]; type in chat and press Enter.\n[accent]/help[white] all commands  [accent]/playerInfo[white] player info\n[accent]/status[white] server status  [accent]/trChat[white] chat translation\n\n[green]【Menus】[white]\nMost commands open a menu with buttons – no need to memorize syntax.\nDon't remember a command? [accent]/help[white], or [accent]/search keyword[white].
tutorial.menu.page2=[gold]=== Server Tutorial [gray]2/4[gold] ===[white]\n\n[green]【UID & @Mentions】[white]\nUID is the [gold]gray number[white] next to your name, used for [accent]@mentions[white]:\nFormat: [gold]@number text[white], e.g. [gold]@123 hello![white]\nThe mentioned player gets notified – handy for calling friends.\n\n[green]【UUID】[white]\nUUID is your unique identity, used by the server to recognize you.\n\n[red]【⚠ Security Warning】[white]\n[scarlet]Never share your UUID in chat or public![white]\nMalicious players can impersonate you with it.\n[gold]Protect your UUID = protect your account!
tutorial.menu.page3=[gold]=== Server Tutorial [gray]3/4[gold] ===[white]\n\n[green]【Voting】[white]\n[accent]/vote[white] lists all votes. Common ones:\n[accent]/vote gameOver[white] vote to end the match\n[accent]/vote skipWave[white] vote to skip the wave\n[accent]/vote fire[white] vote for infinite firepower\n\nWhen a vote is running, type [accent]1/y[white] to agree, [accent]0/n[white] to disagree.\n\n[red]Vote rationally – no bandwagoning! Figure out what happened first.
tutorial.menu.page4=[gold]=== Server Tutorial [gray]4/4[gold] ===[white]\n\n[green]【Server Plugins】[white]\nLots of plugins, mostly menu-based:\n[accent]/skill[white] skills  [accent]/home[white] set/teleport home\n[accent]/tp[white] teleport  [accent]/999[white] claim territory\n[accent]/gather[white] gather  [accent]/schematic[white] schematics\n\n[green]【Auto Protection】[white]\nCore-grief protection and anti-logic-virus are built in;\ndangerous buildings get warned & marked, malicious code gets disabled.\n\n[yellow]Click [green]Close [yellow]to finish. Have fun!
tutorial.menu.title=[green]Server Tutorial
tutorial.reply.playerOnly=[red]Players only

