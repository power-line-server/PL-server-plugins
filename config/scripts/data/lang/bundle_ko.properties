mapScript.towerDefend.introduce=1. 몬스터는 코어만 공격하므로 안심하고 건설하세요\n2. 몬스터에 너무 가까운 유닛은 죽을 수 있습니다\n3. 도로 위에는 건설할 수 없습니다 (위 이유로)\n4. 코어에 연결된 도로에는 무장 컨베이어 배치 가능\n5. 몬스터는 많은 전리품을 드롭합니다 (거리 제한 없음)\n6. 일부 아이템은 비활성화됩니다 (밸런스 유지)
