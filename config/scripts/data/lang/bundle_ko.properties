# ===== tutorial =====
tutorial.command.desc=서버 튜토리얼 보기
tutorial.menu.next=[sky]다음 →
tutorial.menu.page1=[gold]=== 서버 튜토리얼 [gray]1/4[gold] ===[white]\n\n[red]먼저: 캠페인을 클리어한 후 서버를 플레이하시길 권장합니다.[white]\n\n[green]【기본 명령어】[white]\n명령어는 [accent]/[white]로 시작하며, 채팅에 입력 후 Enter로 실행합니다.\n예: [accent]/help[white] 전체 명령어 [accent]/playerInfo[white] 플레이어 정보\n[accent]/status[white] 서버 상태 [accent]/trChat[white] 채팅 번역 설정\n\n[green]【메뉴 조작】[white]\n대부분의 명령어는 메뉴가 열리고 버튼을 클릭하면 됩니다.\n명령어가 기억나지 않으면 [accent]/help[white], 또는 [accent]/search 키워드[white]로 검색하세요.
tutorial.menu.page2=[gold]=== 서버 튜토리얼 [gray]2/4[gold] ===[white]\n\n[green]【UID 및 @멘션】[white]\nUID는 이름 뒤의[gold]회색 숫자[]로, [accent]@멘션[white]에 사용합니다:\n형식: [gold]@숫자 텍스트[white] (예: [gold]@123 안녕![white])\n멘션된 플레이어에게 알림이 갑니다.\n\n[green]【UUID】[white]\nUUID는 계정의 고유 식별자이며, 서버가 이를 통해 당신을 식별합니다.\n\n[red]【⚠ 보안 경고】[white]\n[scarlet]채팅이나 공개 장소에서 절대 UUID를 공유하지 마세요![white]\n악의적인 플레이어가 당신을 사칭할 수 있습니다.\n[gold]UUID 보호 = 계정 보안!
tutorial.menu.page3=[gold]=== 서버 튜토리얼 [gray]3/4[gold] ===[white]\n\n[green]【투표 시스템】[white]\n[accent]/vote[white]로 전체 투표 확인. 자주 쓰는 것:\n[accent]/vote gameOver[white] 게임 종료 투표\n[accent]/vote skipWave[white] 웨이브 건너뛰기 투표\n[accent]/vote fire[white] 무한 화력 투표\n\n투표가 시작되면 채팅에 [accent]1/y[white] 찬성, [accent]0/n[white] 반대를 보내세요.\n\n[red]주의! [white]신중하게 투표하고, 무작정 따라가지 마세요!
tutorial.menu.page4=[gold]=== 서버 튜토리얼 [gray]4/4[gold] ===[white]\n\n[green]【서버 플러그인】[white]\n많은 플러그인이 있으며, 대부분 메뉴 조작입니다:\n[accent]/skill[white] 스킬 [accent]/home[white] 집 설정/이동\n[accent]/tp[white] 이동 [accent]/999[white] 영토 등록\n[accent]/gather[white] 집합 이동 [accent]/schematic[white] 설계도\n\n[green]【자동 보호】[white]\n핵 폭발 방지, 로직 바이러스 방지 등의 보호 기능이 내장되어 있으며,\n위험한 건물은 경고·표시되고, 악성 코드는 비활성화됩니다.\n\n[yellow]아래 [green]닫기 [yellow]버튼을 누르면 종료합니다. 즐거운 플레이 되세요!
tutorial.menu.title=[green]서버 튜토리얼
tutorial.reply.playerOnly=[red]플레이어만 사용 가능

