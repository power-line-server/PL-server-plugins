mapScript.autoExchange.introduce=아이디어/구현: [gold]WayZer[]\n모든 자원이 자동으로 등가 교환되며, 비율에 따라 동기화됩니다. 코어 자원은 현재 최대 교환 가능 수량입니다.\n[green]TIP[]: 갑자기 부자가 된 착각을 할 수 있으니, 가치 판단은 단일 자원으로 하세요.\n\n모든 코어 용량 = 바닐라 * 10\n0가치 자원(BAN): 모래, 휴면 낭종, 핵분열 물질\n1가치 자원: 대부분\n2가치 자원: 티타늄, 흑연, 실리콘, 유황\n3가치 자원: 토륨, 플라스타늄, 산화물, 폭발 화합물\n4가치 자원: 텅스텐, 탄화물, 위상 섬유, 서지 합금
