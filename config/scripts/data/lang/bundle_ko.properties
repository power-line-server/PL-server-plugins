renderMap.reply.done=[green]렌더링 완료, 저장 위치: {path}
renderMap.reply.error=[red]렌더링 오류: {msg}
renderMap.reply.fail=[red]렌더링 실패: 이미지가 너무 큽니다 (scale을 줄이세요)
renderMap.reply.noPermission=[red]이 명령을 사용할 권한이 없습니다
renderMap.reply.start=[yellow]맵 렌더링을 시작합니다（타일당 {scale}px）。잠시만 기다려 주세요…
