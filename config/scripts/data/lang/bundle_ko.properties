mapScript.1005.description=물로 가득 찬 행성에 도착했습니다,\n하지만 우리는 전통적인 능력인 [sky]매립[]을 가지고 있습니다.\n\n또한 우리는 공기에서 에너지를 얻는 첨단 기술을 보유하고 있습니다 - [sky]무한 화력[]\n그리고 약간의 재료만으로 에너지를 물질로 변환할 수 있습니다 - [sky](거의) 무료 건설[]\n하지만 순수 에너지 속도는 다소 느립니다.\n\n[@pvpProtect=0]\n밸런스 조정: T4 해양 지원 유닛의 치료 능력 약화, 대형 치료는 소형 치료와 동일한 치료량 (범위는 더 넓음)\n중형 펌프 30 유리 10 합금, 대형 펌프 30 산화물\n건설 타워 200 산화물, 과속 100 위상 섬유 500 산화물\n[red]베타 밸런스 조정[]
