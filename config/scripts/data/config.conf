coreLibrary {
  commands {
    permissionCmd {
      # 调试输出,如果开启,则会在后台打印权限请求
      debug = false
      # 权限设置
      # 值为权限，@开头为组,支持末尾通配符.*
      groups = {
        "@default" = [
        "$dotId.pingAll",
        "wayzer.ext.gather",
        "wayzer.ext.history",
        "wayzer.ext.observer",
        "wayzer.ext.welcomeReload",
        "wayzer.lang.set",
        "wayzer.user.devil.*",
        "wayzer.vote.*"
      ]
      "@vip" = [
        "suffix.vip",
        "wayzer.user.title",
        "wayzer.user.skills.*"
      ]
      "@admin" = [
        "@vip",
        "scriptAgent.*",
        "suffix.admin",
        "wayzer.admin",
        "wayzer.admin.*",
        "wayzer.cmds.*",
        "wayzer.ext.team.change",
        "wayzer.ext.tp",
        "wayzer.mapBlacklist.manage",
        "wayzer.maps.gameover",
        "wayzer.maps.host",
        "wayzer.user.title"
      ]
      # 风纪委员(moderator)组: 拥有 banX 全部功能/解封/强制观战等管理能力
      "@moderator" = [
        "wayzer.moderator",
        "wayzer.moderator.*",
        "wayzer.admin.unban",
        "wayzer.admin.forceOb",
        "wayzer.admin.blockCmd",
        "wayzer.vote.*"
      ]
      # 风纪委员成员添加方式(任选其一):
      #   1. data/moderators.txt 文件: 每行一个玩家标识(uuid/数字UID/玩家名), 推荐(易维护)
      #   2. 在下方按 uuid 绑定: "0123456789abcdef0123456789abcdef" = ["@moderator"]
      }
    }
  }
  db {
    h2db {
      # 开启H2DB
      enable = true
      # 是否保留关键字大小写, 老用户请设置为false
      preserveKeywordCasing = true
    }
  }
  extApi {
    rpcService {
      # RPC,监听端口
      port = 10099
    }
  }
  lang {
    # 控制台语言(不发给玩家的语句)
    console = "zh_CN"
    # 备用语言映射表,@raw表示内部语言,*代表所有未匹配
    fallbackMap = {"*":"overwrite","overwrite":"@raw"}
    # Mindustry 源码目录路径（指向包含 core/ 的顶层目录，如 ../Mindustry-159.6 或 D:/Mindustry-159.7）。留空则回退到 Vars.tree
    mindustrySourceDir = "../Mindustry-159.7"
  }
}

coreMindustry {
  console {
    # 本地命令管道监听端口(0=禁用), 仅监听 127.0.0.1, 每行一条 UTF-8 命令
    # 用于无损注入中文命令(WriteConsoleInput 注入中文会被 Windows 控制台截断)
    # 多开服务器时各实例需使用不同端口
    cmdPipePort = 6568
  }
  scoreboard {
    # 积分榜模板
    # 其中{cK}{cV}{cA}为颜色变量，{listPrefix xx}行供其他插件动态扩展。
    # 开头{magic}会被替换特殊颜色，供MDTX客户端识别
    template = "{magic}[sky]欢迎 {cV}{player.name} [sky]来到[yellow]Power [sky]line\n{listPrefix scoreboard.ext|joinLines}\n{listPrefix scoreBroad.ext|joinLines}\n[green]服务器状态\n[accent]|[]   [green]地图: [ [yellow]{map.id} [green]][yellow]{map.name}[green] 模式: [yellow]{map.mode} [green]波数[yellow]{state.wave}\n[accent]|[]   [green]下一波: [yellow]{state.nextWave}秒[green]  敌人: [yellow]{state.enemies}\n[accent]|[]   {cK}本局游戏时间: {cV}{state.gameTime m}分钟\n[accent]|[]   [green]{tps} TPS, 内存 {heapUse} MB, 运行时长 {state.uptime}[]\n[accent]|[]   [green]总单位数: {state.allUnit} 玩家数: {state.playerSize}\n\n[gold]欢迎加入服务器QQ群：1034687528\n{cA}输入 /broad 可以开关该显示"
  }
}

wayzer {
  cmds {
    mapsCmd {
      # /maps每页显示数
      mapsPrePage = 8
    }
    saveMgr {
      # 每页显示存档数量
      PAGE_SIZE = 10
    }
  }
  ext {
    alert {
      # 公告列表,支持颜色和变量
      list = []
      # 公告间隔
      time = "600s"
      # 发送方式
      type = "InfoMessage"
    }
    gameInfo {
      # 最大存储游戏记录数
      maxGameRecords = 20
    }
    goServer {
      # 服务器传送列表
      # 格式: {名字: "介绍;地址"} (;作为分割符, 地址可带端口如 ip:port 或 域名)
      servers = {}
    }
    profiler {
      # 采样器启动命令, FILE会被替换为实际文件路径
      command = "start,jfr,event=cpu,interval=500us,file=FILE"
    }
    schematicShare {
      # /schematic 每页显示数
      prePage = 8
    }
    welcomeMsg {
      # 是否开启自定义进服信息(中文)
      customWelcome = true
      # 欢迎信息模板
      template = "{tr welcome.message.template}"
    }
  }
  map {
    autoHost {
      # 自动Host的延迟时间,太短可能服务器未准备就绪
      autoHostTime = "5s"
    }
    resourceHelper {
      # Mindustry资源站Api
      webRoot = "https://api.mindustry.top"
    }
  }
  maps {
    # 是否开启原版内置地图
    configEnableInternMaps = false
    # 游戏结束消息是显示方式
    gameOverMsgType = "InfoMessage"
    # 自动换图是否选择相同模式地图,否则选择生存模式
    nextSameMode = false
    # 游戏结束换图的等待时间
    waitingTime = "10s"
  }
  reGrief {
    history {
      # 单格最长日记记录
      historyLimit = 1000
    }
  }
  user {
    suffix {
      # 记录玩家的版本信息
      logVersion = false
    }
    ban {
      # 风纪委员封禁时长上限(分钟), 0=不限制; 管理员不受此限制
      moderatorBanMaxTime = 10080
      # 针对风纪委员的投票通过阈值(0-1), 达到该比例赞成才可通过
      moderatorVoteThreshold = 0.8
    }
    trChat {
      # ===== 免费翻译API(玩家可一键选用) =====
      # 以下四个字段全部填写后, 玩家可在 /trChat -> API设置 中勾选"使用免费翻译API"
      # 免费API是服主统一付费/提供密钥, 玩家无需自己填API, 语言筛选强制为"仅不同语言"
      # 注意: 免费API密钥对所有玩家可见吗? 否! 玩家端只显示"服务器提供", 不会泄露密钥
      #
      # freeApiType:   API服务商类型, 可选 OPENAI / CLAUDE / GOOGLE
      # freeApiBaseUrl: API接口地址, 如 https://api.openai.com/v1
      # freeApiApiKey:  API密钥, 如 sk-xxxx
      # freeApiModel:   模型名, 如 gpt-4o-mini / claude-3-5-haiku
      # freeApiMaxContext: 免费API最大上下文token数(防止玩家乱设导致用不起)
      #   术语表开关开启时, 会注入约100k上下文的双语术语对照, 请保证此值>=102400
      # 免费翻译API: API密钥
      freeApiApiKey = ""
      # 免费翻译API: API地址
      freeApiBaseUrl = ""
      # 免费API最大上下文token数(防止玩家乱设置导致用不了)
      freeApiMaxContext = 102400
      # 免费API: 翻译温度(0.0-2.0, -1=不指定, 默认0.0 最确定)
      freeApiTemperature = -1
      # 免费API: 是否思考(推理模式, true=开启思考, false=关闭)
      #   开启后翻译更准但更慢更贵; 思考开启时温度不生效(多数API)
      freeApiThinking = false
      # 免费API: 思考代价(none/low/medium/high/xhigh/max, 仅在思考开启时生效)
      freeApiReasoningEffort = "none"
      # 免费API: 请求超时秒数(10-300, 思考开启时建议调大)
      freeApiTimeout = 60
      # 免费翻译API: 模型名
      freeApiModel = ""
      # 免费翻译API: Provider类型(OPENAI/CLAUDE/GOOGLE)
      freeApiType = ""
    }
  }
  webui {
    # 监听地址
    host = "0.0.0.0"
    # 监听端口
    port = 8080
    # 管理 token，auto 表示自动生成
    token = "auto"
    # session token 有效期(秒)
    tokenExpire = 86400
    # 超级管理员用户名(网页登录用)
    adminUser = "admin"
    # 状态快照更新间隔(毫秒)
    statusSnapshotIntervalMs = 1000
    # 地图缩略图缓存时间(秒)
    snapshotCacheSec = 30
    # ===== 速率限制(默认关闭; 开启后五层限速: 密钥级 -> 整体 -> 写操作 -> 节点级 -> API 级) =====
    # 是否启用 API 速率限制
    rateLimitEnabled = true
    # 整体请求限速(每 user@IP 每秒请求数; 密钥配置了独立限速时按密钥整体计数)
    rateLimitPerSec = 10
    # 整体请求令牌桶容量
    rateLimitBurst = 40
    # 写操作(POST/PUT/DELETE)限速(每 user@IP 每秒)
    rateOpPerSec = 3
    # 写操作令牌桶容量
    rateOpBurst = 10
    # 节点级限速覆盖: 节点名 -> 每秒(0=不限), 如 { "webui.api.console" = 1 }
    rateLimitPerNode = {}
    # API级限速覆盖: 端点路径 -> 每秒(0=不限), 如 { "/api/command" = 1 }
    rateLimitPerApi = {}
    # ===== 并发限制(可在 WebUI 设置页修改, 保存即生效) =====
    # 全局并发请求数上限(超过返回 429; SSE 长连接不计入)
    maxConcurrentRequests = 32
    # 是否启用 HTTPS(自签证书, 流量加密防抓包, 抓包只能看到 TLS 密文)
    # 证书生成: 运行 server 目录下的 gen_keystore.bat (Windows) / gen_keystore.sh (Linux)
    #   脚本自动探测公网 IP、自动定位 keytool、自动读取本配置的密码, 一键生成
    #   服务器换公网 IP 后需重新运行一次脚本, 然后重启服务器并在浏览器重新导入证书
    # 证书文件: data/webui/keystore.p12 (含私钥, 切勿公开, 已加入 .gitignore)
    # 浏览器首次访问 https://IP:8080 会提示证书不受信任, 导入 keystore.p12 到"受信任的根证书颁发机构"后消除
    sslEnabled = false
    # HTTPS 证书库路径(PKCS12, 相对于 data 目录)
    sslKeystore = "webui/keystore.p12"
    # 证书库密码
    sslKeystorePass = "change-me"

    # 是否启用 WebUI
    webuiEnabled = true
  }
}










































































